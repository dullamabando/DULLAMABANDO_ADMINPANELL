    /* Kivuli laini ili maandishi yasomeke vizuri juu ya picha */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(14, 6, 30, .35) 0%, rgba(14, 6, 30, .55) 55%, rgba(14, 6, 30, .75) 100%);
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
    }

    /* ===== GLASS CARDS ===== */
    .card {
      background-color: rgba(14, 8, 32, .38);
      background-image: linear-gradient(135deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04));
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .28);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .45), 0 12px 36px rgba(0, 0, 0, .4);
      padding: 22px;
      border-radius: 22px;
      margin-bottom: 18px;
    }

    h1, h2 {
      margin-top: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
    }

    /* ===== GLASS INPUTS ===== */
    input {
      display: block;
      width: 100%;
      padding: 13px 20px;
      margin: 12px 0;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .3);
      font-size: 16px;
      outline: none;
      transition: border-color .2s, background .2s;
    }

    input::placeholder { color: rgba(255, 255, 255, .6); }

    input:focus {
      border-color: rgba(255, 255, 255, .75);
      background: rgba(255, 255, 255, .18);
    }

    input:-webkit-autofill {
      -webkit-text-fill-color: #fff;
      -webkit-box-shadow: 0 0 0 1000px rgba(60, 40, 100, .55) inset;
      transition: background-color 9999s ease-out;
    }

    /* ===== GLASS PILL BUTTONS ===== */
    button {
      padding: 12px 26px;
      background: linear-gradient(135deg, rgba(18, 201, 138, .6), rgba(18, 201, 138, .2));
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .45);
      border: 1px solid rgba(190, 255, 230, .6);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      backdrop-filter: blur(16px) saturate(170%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), inset 0 -1px 1px rgba(255, 255, 255, .1), 0 8px 24px rgba(0, 0, 0, .35);
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: transform .12s, filter .2s, box-shadow .2s;
    }

    button:hover { filter: brightness(1.15); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message, #orderMessage {
      margin-top: 14px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    /* ===== GLASS TABLE ===== */
    .table-wrap {
      overflow-x: auto;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 16px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .3);
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
      color: #fff;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .16);
      text-align: left;
      font-size: 14px;
    }

    th {
      background: rgba(255, 255, 255, .16);
      font-weight: bold;
    }

    tbody tr:hover td { background: rgba(255, 255, 255, .07); }

    .muted { color: #e6eef8; }

    #dashboard { display: none; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logout {
      background: linear-gradient(135deg, rgba(255, 204, 102, .65), rgba(255, 204, 102, .22));
      border-color: rgba(255, 236, 190, .75);
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .card { padding: 16px; }
    }


    /* ===== LOGIN SCENE (taa + roboti + glass panel) ===== */
    .container { position: relative; z-index: 1; }
    body:not(.in-dash) .container > .card:first-child { display: none; }
    .scene {
      --t: #2de2b6;
      display: flex; max-width: 860px; min-height: 400px; margin: 40px auto 18px; overflow: hidden;
      border-radius: 34px; border: 1px solid rgba(45, 226, 182, .22);
      background: radial-gradient(120% 90% at 20% 0%, #0b3a33 0%, #05211d 45%, #03100e 100%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 1px rgba(255, 255, 255, .15), inset 0 0 60px rgba(45, 226, 182, .08);
    }
    .stage { position: relative; flex: 0 0 36%; min-height: 360px; overflow: hidden; }
    .lamp { position: absolute; top: 0; left: calc(50% - 55px); width: 110px; text-align: center; z-index: 2; }
    .cord { display: block; width: 2px; height: 70px; margin: 0 auto; background: #6b7f7b; }
    .lamp svg { width: 110px; height: 52px; display: block; }
    .beam {
      position: absolute; top: 118px; bottom: 0; left: 8%; width: 84%;
      clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, rgba(60, 255, 200, .6), rgba(60, 255, 200, .04));
      filter: blur(6px);
    }
    .floorglow { position: absolute; bottom: 20px; left: 18%; width: 64%; height: 28px; background: radial-gradient(ellipse, rgba(45, 226, 182, .6), transparent 70%); filter: blur(4px); }
    .bot { position: absolute; bottom: 40px; left: calc(50% - 60px); width: 120px; height: 120px; filter: drop-shadow(0 0 16px rgba(45, 226, 182, .55)); }
    .eyes { transform-box: fill-box; transform-origin: center; animation: hxBlink 4s infinite; }
    .pupil { transform: translateX(3px); }

    .gp {
      position: relative; flex: 1; margin: 18px; padding: 28px 26px; overflow: hidden; text-align: left;
      display: flex; flex-direction: column; justify-content: center;
      border-radius: 24px; border: 1px solid rgba(255, 255, 255, .2);
      background: linear-gradient(135deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03));
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35);
    }
    .gp::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255, 255, 255, .08) 0 42%, transparent 42%); }
    .gp > * { position: relative; }
    .brand { margin: 0 0 6px; font-size: 11px; letter-spacing: .2em; color: var(--t); font-weight: bold; }
    .wt { margin: 0; font-size: 30px; }
    .wt em { font-style: normal; color: var(--t); }
    .sub { margin: 6px 0 18px; font-size: 13px; color: #b9d4cd; }
    .scene .lbl { display: block; margin: 12px 0 0; font-size: 11px; letter-spacing: .12em; color: var(--t); font-weight: bold; }
    .field { position: relative; }
    .scene input { margin: 6px 0 0; padding: 12px 14px 12px 44px; border-radius: 14px; background: rgba(0, 0, 0, .28); border-color: rgba(45, 226, 182, .3); box-shadow: none; }
    .scene input:focus { border-color: var(--t); box-shadow: 0 0 0 3px rgba(45, 226, 182, .2); }
    .field .pw-in { padding-right: 52px; }
    .ico { position: absolute; left: 15px; top: 50%; width: 18px; height: 18px; margin-top: 3px; transform: translateY(-50%); opacity: .8; pointer-events: none; }
    .eye {
      position: absolute; right: 6px; top: 50%; margin-top: 3px; transform: translateY(-50%); width: 38px; height: 38px; padding: 0;
      display: flex; align-items: center; justify-content: center; background: none; border: 0; box-shadow: none;
      -webkit-backdrop-filter: none; backdrop-filter: none; text-shadow: none; border-radius: 50%;
    }
    .eye:active { transform: translateY(-50%) scale(.9); }
    .eye svg { width: 21px; height: 21px; }
    .eye .slash { display: none; }
    .eye.on .slash { display: block; }
    #loginButton {
      width: 100%; margin-top: 20px; padding: 14px; color: #03231c; text-shadow: none; letter-spacing: .1em;
      background: linear-gradient(135deg, #3ff0c2, #19b98f); border: 1px solid rgba(255, 255, 255, .45);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), 0 0 26px rgba(45, 226, 182, .55);
    }
    #loginButton::after { content: " \2192"; }
    #message { color: #fff; }

    body.intro .scene { animation: hxFade .8s both; }
    body.intro .lamp { animation: hxLamp 1s cubic-bezier(.3, 1.4, .5, 1) .6s both; }
    body.intro .beam { animation: hxFade 1.2s steps(14, end) 1.6s both; }
    body.intro .floorglow, body.intro .bot { animation: hxUp .8s 2.3s both; }
    body.intro .pupil { animation: hxLook .6s 3s both; }
    body.intro .gp { animation: hxSlide .9s cubic-bezier(.2, .9, .3, 1) 3.1s both; }
    body.intro .brand, body.intro .wt, body.intro .sub { animation: hxUp .6s 3.7s both; }
    body.intro .fld1 { animation: hxUp .6s 4.2s both; }
    body.intro .fld2 { animation: hxUp .6s 4.6s both; }
    body.intro #loginButton { animation: hxUp .6s 5s both, hxGlow 1.2s ease-in-out 5.6s 2; }
    @keyframes hxFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hxLamp { from { transform: translateY(-120%); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes hxUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes hxSlide { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
    @keyframes hxLook { from { transform: translateX(0); } to { transform: translateX(3px); } }
    @keyframes hxBlink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes hxGlow { 50% { box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), 0 0 48px 8px rgba(45, 226, 182, .9); } }
    @media (max-width: 700px) {
      .scene { flex-direction: column; margin-top: 16px; }
      .stage { flex-basis: auto; min-height: 250px; }
      .cord { height: 36px; }
      .beam { top: 84px; }
      .gp { margin: 0 12px 14px; padding: 22px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body class="intro">
<div class="container">

  <div class="card">
    <h1>DULLA MABANDO</h1>
    <p class="muted">Mfumo wa usimamizi wa oda za wateja</p>
  </div>

  <section id="loginPanel" class="scene">
    <div class="stage" aria-hidden="true">
      <div class="beam"></div>
      <div class="lamp">
        <span class="cord"></span>
        <svg viewBox="0 0 110 52"><defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5754"/><stop offset="1" stop-color="#1b2523"/></linearGradient></defs><path d="M40 0h30l40 44H0z" fill="url(#sh)"/><ellipse cx="55" cy="46" rx="24" ry="6" fill="#9ffbe5"/></svg>
      </div>
      <div class="floorglow"></div>
      <svg class="bot" viewBox="0 0 120 120">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14564c"/><stop offset="1" stop-color="#082a25"/></linearGradient></defs>
        <circle cx="10" cy="62" r="9" fill="#0d3b34" stroke="#2de2b6" stroke-width="2"/><circle cx="110" cy="62" r="9" fill="#0d3b34" stroke="#2de2b6" stroke-width="2"/>
        <circle cx="60" cy="60" r="48" fill="url(#hg)" stroke="#2de2b6" stroke-width="3"/>
        <circle cx="60" cy="60" r="38" fill="#07201d"/>
        <g class="eyes"><circle cx="46" cy="54" r="10" fill="#fff"/><circle cx="74" cy="54" r="10" fill="#fff"/><circle class="pupil" cx="46" cy="55" r="5" fill="#06201c"/><circle class="pupil" cx="74" cy="55" r="5" fill="#06201c"/></g>
        <path d="M44 78Q60 90 76 78" stroke="#2de2b6" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="gp">
      <p class="brand">DULLA MABANDO</p>
      <h2 class="wt">Karibu <em>Tena.</em></h2>
      <p class="sub">Ingia kwenye akaunti yako ya Admin kuangaza njia yako.</p>

      <form id="loginForm">
        <div class="fld fld1">
          <label class="lbl" for="email">EMAIL</label>
          <div class="field">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#2de2b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input id="email" type="email" placeholder="Email yako" autocomplete="username" required>
          </div>
        </div>
        <div class="fld fld2">
          <label class="lbl" for="password">PASSWORD</label>
          <div class="field">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#2de2b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
            <input id="password" class="pw-in" type="password" placeholder="Password yako" autocomplete="current-password" required>
            <button type="button" class="eye" id="togglePw" aria-label="Onyesha password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="#2de2b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
            </button>
          </div>
        </div>
        <button id="loginButton" type="submit">INGIA</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="dashboard">
    <div class="card">
      <div class="top">
        <div>
          <h2>Oda za Wateja</h2>
          <p class="muted">Oda 100 za hivi karibuni</p>
        </div>
        <div>
          <button id="refreshButton">Refresh Oda</button>
          <button id="logoutButton" class="logout">Toka</button>
        </div>
      </div>
      <p id="orderMessage" role="status" aria-live="polite"></p>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Mtandao</th>
              <th>Kifurushi</th>
              <th>Namba ya Simu</th>
              <th>Kiasi</th>
              <th>Hali</th>
              <th>Tarehe</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="7">Bado hakuna taarifa za kuonyesha.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<script>
(() => {
  const SUPABASE_URL =
    "https://gwayutaqkeezjsvpaysj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_z4LNIJQJNh2sJByurMD_yQ_wuqWs8Kt";

  const ADMIN_USER_ID =
    "907f4392-b478-49af-bfe5-9ce3980971f0";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const message = document.getElementById("message");
  const orderMessage = document.getElementById("orderMessage");
  const ordersBody = document.getElementById("ordersBody");

  let working = false;

  function showMessage(text, color = "#ffffff") {
    message.textContent = text;
    message.style.color = color;
  }

  function showLogin(text = "") {
    loginPanel.style.display = "block";
    dashboard.style.display = "none";
    showMessage(text);
  }

  function showDashboard() {
    loginPanel.style.display = "none";
    dashboard.style.display = "block";
    message.textContent = "";
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
  }

  async function checkAdmin(user) {
    if (!user) {
      return {
        allowed: false,
        error: "Tafadhali ingia kwa kutumia email na password."
      };
    }

    if (user.id !== ADMIN_USER_ID) {
      return {
        allowed: false,
        error: "Akaunti hii haijaidhinishwa kuwa Admin."
      };
    }

    const { data, error } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      return {
        allowed: false,
        error: "Imeshindikana kuthibitisha ruhusa za Admin: " +
          error.message
      };
    }

    if (!data) {
      return {
        allowed: false,
        error: "Akaunti imeingia lakini haipo kwenye orodha ya Admin."
      };
    }

    return { allowed: true };
  }

  async function loadOrders() {
    orderMessage.textContent = "Inapakia oda...";
    ordersBody.innerHTML =
      '<tr><td colspan="7">Inapakia...</td></tr>';

    const { data, error } = await db
      .from("orders")
      .select("id, bundle_name, phone, amount, network, status, created_at")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      orderMessage.textContent =
        "Imeshindwa kupakia oda: " + error.message;
      ordersBody.innerHTML =
        '<tr><td colspan="7">Imeshindwa kupakia taarifa.</td></tr>';
      return;
    }

    if (!data || data.length === 0) {
      orderMessage.textContent = "Hakuna oda zilizopatikana.";
      ordersBody.innerHTML =
        '<tr><td colspan="7">Hakuna oda kwa sasa.</td></tr>';
      return;
    }

    orderMessage.textContent = "Oda zilizopatikana: " + data.length;

    ordersBody.innerHTML = data.map(order => {
      let date = order.created_at || "";
      if (date) {
        const parsed = new Date(date);
        if (!Number.isNaN(parsed.getTime())) {
          date = parsed.toLocaleString("sw-TZ");
        }
      }

      const amount = Number(order.amount);
      const formattedAmount = Number.isFinite(amount)
        ? "TSh " + amount.toLocaleString("en-US")
        : order.amount ?? "";

      return `
        <tr>
          <td>${escapeHTML(order.id)}</td>
          <td>${escapeHTML(order.network)}</td>
          <td>${escapeHTML(order.bundle_name)}</td>
          <td>${escapeHTML(order.phone)}</td>
          <td>${escapeHTML(formattedAmount)}</td>
          <td>${escapeHTML(order.status)}</td>
          <td>${escapeHTML(date)}</td>
        </tr>
      `;
    }).join("");
  }

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();

    if (working) return;
    working = true;
    loginButton.disabled = true;
    loginButton.textContent = "INAINGIA...";
    showMessage("Inathibitisha taarifa ulizoingiza...");

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(
          "Imeshindikana kuingia: " + error.message,
          "#ffb4b4"
        );
        return;
      }

      const result = await checkAdmin(data.user);

      if (!result.allowed) {
        await db.auth.signOut();
        showLogin(result.error);
        return;
      }

      showDashboard();
      await loadOrders();

    } catch (error) {
      showMessage(
        "Hitilafu imetokea: " + (error.message || "Jaribu tena."),
        "#ffb4b4"
      );
    } finally {
      working = false;
      loginButton.disabled = false;
      loginButton.textContent = "INGIA";
    }
  });

  document.getElementById("refreshButton")
    .addEventListener("click", async () => {
      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        showLogin("Tafadhali ingia tena.");
        return;
      }

      const result = await checkAdmin(data.user);

      if (!result.allowed) {
        await db.auth.signOut();
        showLogin(result.error);
        return;
      }

      await loadOrders();
    });

  document.getElementById("logoutButton")
    .addEventListener("click", async () => {
      await db.auth.signOut();
      ordersBody.innerHTML = "";
      showLogin("Umetoka kwenye akaunti ya Admin.");
    });

  // Muhimu: HATUKAGUI akaunti ukurasa unapofunguka.
  // Ukurasa unaanza moja kwa moja kwenye fomu ya kuingia.
  showLogin();
})();
</script>
<script>
/* Intro ya mhusika + jicho la password (haigusi logic ya Admin) */
(function () {
  var b = document.body;
  function endIntro() { b.classList.remove("intro"); }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    endIntro();
  } else {
    setTimeout(endIntro, 7200);
    addEventListener("pointerdown", endIntro, { once: true });
  }

  var pw = document.getElementById("password");
  var eye = document.getElementById("togglePw");
  eye.addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    eye.classList.toggle("on", show);
    eye.setAttribute("aria-pressed", show ? "true" : "false");
    eye.setAttribute("aria-label", show ? "Ficha password" : "Onyesha password");
  });

  var dash = document.getElementById("dashboard");
  new MutationObserver(function () {
    b.classList.toggle("in-dash", dash.style.display === "block");
  }).observe(dash, { attributes: true, attributeFilter: ["style"] });
})();
</script>
</body>
</html>
